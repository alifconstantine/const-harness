# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@const-ai/system-prompt'

- id: tools
  name: '@const-ai/tools'

- id: subprocess
  name: '@const-ai/subprocess-local'

- id: bash
  name: '@const-ai/pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@const-ai/shell-env'

- id: tasks
  name: '@const-ai/jobs-local'

- id: tool-jobs
  name: '@const-ai/tool-jobs'

- id: tool-pwsh
  name: '@const-ai/tool-pwsh'
