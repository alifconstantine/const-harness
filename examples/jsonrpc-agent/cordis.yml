# Unattended coding-agent deployment for the bundled dsh-jsonrpc-agent runtime.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.

- id: sdk-jsonrpc-server
  name: '@const-ai/sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# The DeepSeek adapter. Shipped default: full thinking at max effort on every
# request; exact-model resolution materializes request defaults before logging.
# The model arrives per session over JSON-RPC, so it is not pinned here.
- id: llm-deepseek
  name: '@const-ai/llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@const-ai/subprocess-local'

- id: bash
  name: '@const-ai/bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@const-ai/agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@const-ai/session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@const-ai/session-checkpoint-policy'

- id: subagent
  name: '@const-ai/subagent'

- id: subagent-spawn-in-process
  name: '@const-ai/subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@const-ai/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@const-ai/tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@const-ai/fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@const-ai/fs-observation-policy'

- id: tool-fs
  name: '@const-ai/tool-fs'

- id: token-meter
  name: '@const-ai/token-meter'

- id: compaction-basic
  name: '@const-ai/compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
